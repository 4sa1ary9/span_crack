# SpanCrack on CrackMap: fixed-threshold and sweep metrics on the test split.
experiment:
  name: eval_spancrack_crackmap_s2025
  dataset: crackmap
model:
  variant: tcs_seg
  type: b0
  arch:
    use_crack_adapters: false
    use_texture_suppression: false
    use_width_adaptive_fusion: true
    width_mode: constant
    use_topology_aux_heads: true
    decoder_dim: 64
    adapter_reduction: 4
    adapter_init_scale: 0.0
    use_coord_attention: true
    use_ms_context: true
    use_channel_spatial_gate: true
  checkpoint: weights/spancrack/crackmap/seed_2025/checkpoints/best.pth
data:
  image_dir: ../data/CrackMap/test_img
  mask_dir: ../data/CrackMap/test_lab
evaluation:
  batch_size: 1
  fixed_threshold: 0.5
  threshold_min: 0.01
  threshold_max: 0.99
  threshold_steps: 99
output:
  root_dir: outputs/spancrack/eval/crackmap/seed_2025
  report_prefix: eval_spancrack_crackmap_s2025
